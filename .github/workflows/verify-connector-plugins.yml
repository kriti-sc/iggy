# Throwaway fork-only harness. Runs the edge release build on a branch so the
# Connector plugins job can be exercised before merge. Never goes upstream.

name: verify connector plugins

on:
  workflow_dispatch:
  push:
    branches: ["verify/**"]

permissions:
  contents: read

jobs:
  build-artifacts:
    uses: ./.github/workflows/_build_rust_artifacts.yml
    with:
      version: verify
      upload_artifacts: false
